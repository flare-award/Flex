# Copy this file to .github/workflows/deploy.yml in your repository to enable
# automatic deployment to GitHub Pages. Set a repository secret FLEX_API_URL
# pointing to your Glitch (or other) backend, e.g. https://my-flex.glitch.me.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, arena/019f9ee0-flex]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
            package-lock.json
      - run: npm run install:all
      # Build client. Set VITE_API_URL to your Glitch backend URL via GitHub secret FLEX_API_URL,
      # e.g. https://my-flex.glitch.me. If not set, assumes same-origin (won't work on GH Pages).
      - name: Build client
        working-directory: client
        env:
          VITE_API_URL: ${{ secrets.FLEX_API_URL }}
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npx vite build
      - name: Copy SPA fallback
        run: cp client/dist/index.html client/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
