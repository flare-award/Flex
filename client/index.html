<!DOCTYPE html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#1e1f22" />
    <title>Flex — P2P чат (GitHub Pages + Firebase + WebRTC)</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%235865f2'/%3E%3Ctext x='50' y='66' font-size='54' text-anchor='middle' fill='white' font-family='Inter,sans-serif' font-weight='800'%3EF%3C/text%3E%3C/svg%3E" />
    <script>
      // GH Pages SPA redirect: if we landed with ?p=/deep/path, rewrite history.
      (function() {
        var url = new URL(window.location.href);
        var p = url.searchParams.get('p');
        if (p) {
          url.searchParams.delete('p');
          var rest = p;
          var path = window.location.pathname;
          var base = path.endsWith('/') ? path : path.replace(/\/[^\/]*$/, '/');
          var rel = rest.replace(/^\/+/, '');
          window.history.replaceState(null, '', base + rel + url.search + url.hash);
        }
      })();
    </script>
  </head>
  <body class="bg-flex-server text-flex-text font-sans m-0 p-0 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
